name: Compile and Release Target Firmware

on:
  push:
    tags:
      - 'v*' # Triggers only when you push a tag like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v3

      - name: Install ESP32 Core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile Sketch
        run: |
          # Replace 'TargetFirmware' with the exact name of your sketch folder
          arduino-cli compile --fqbn esp32:esp32:nodemcu-32s --export-binaries ./TargetFirmware

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # This grabs the compiled .bin file from the build directory
          files: ./TargetFirmware/build/esp32.esp32.nodemcu-32s/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
