name: Build and Release Target Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build flat_nodeMCU with ESP-IDF
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32
          idf.py build

      - name: Package Firmware as nodemcu_blink.bin
        run: |
          mkdir -p release_assets
          if [ -f build/flat_nodeMCU.bin ]; then
            cp build/flat_nodeMCU.bin release_assets/nodemcu_blink.bin
          else
            cp build/*.bin release_assets/nodemcu_blink.bin
          fi
          ls -la release_assets/

      - name: Upload nodemcu_blink.bin to Release 0.0.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 0.0.1
          name: Release 0.0.1
          files: release_assets/nodemcu_blink.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
